version: "3.8"

services:
  mysql:
    image: mariadb:11
    environment:
      MYSQL_DATABASE: webhooks
      MYSQL_USER: webhooks
      MYSQL_PASSWORD: webhooks
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: webhooks
      DB_USERNAME: webhooks
      DB_PASSWORD: webhooks
      QUEUE_CONNECTION: database
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
    command: sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"

  worker:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: webhooks
      DB_USERNAME: webhooks
      DB_PASSWORD: webhooks
      QUEUE_CONNECTION: database
    volumes:
      - .:/var/www
    command: php artisan queue:work --tries=3 --sleep=2

volumes:
  mysql_data: